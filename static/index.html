<!doctype html>
<html lang="en" data-mode="light" data-palette="violet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprinto Outreach Desk</title>
  <script>/* apply the saved palette and mode before the page paints (no flash) */
    try { var d = document.documentElement, m = localStorage.getItem("mode") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          d.dataset.mode = m; var p = localStorage.getItem("palette"); d.dataset.palette = ["violet","emerald","ocean","midnight","clay","orchid"].indexOf(p) >= 0 ? p : "violet"; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/today">Sprinto Outreach Desk</a>
    <span class="sp"></span>
    <span class="small muted" id="status"><span class="dot"></span>Loading…</span>
    <select class="sel small" id="palette" aria-label="Colour scheme">
      <option value="violet">Colours: Violet</option><option value="emerald">Colours: Emerald</option><option value="ocean">Colours: Ocean</option>
      <option value="midnight">Colours: Midnight</option><option value="clay">Colours: Clay</option><option value="orchid">Colours: Orchid</option></select>
    <button class="btn sm" id="mode">Dark mode</button>
  </header>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/today" data-p="today">Today</a>
      <a href="#/drafts" data-p="drafts">Drafts <span class="count" id="n-drafts">0</span></a>
      <a href="#/rejected" data-p="rejected">Rejected</a>
      <a href="#/sources" data-p="sources">Sources</a>
      <a href="#/runs" data-p="runs">Runs &amp; health</a>
      <span class="grow"></span>
      <a href="#/settings" data-p="settings">Settings</a>
      <a href="#/account" data-p="account"><span><span class="avatar" id="avatar">N</span>Account</span></a>
    </nav>
    <main id="main"></main>
  </div>
  <dialog id="dlg"></dialog>
  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
