<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review desk</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Review desk</h1>
    <button class="btn primary" id="btn-run" title="Searches Google News for companies that match the ICP and saves what it finds">Run</button>
    <span class="muted small" id="runmsg">Nothing is sent by this software. Your decisions are only recorded.</span>
    <span class="spacer"></span>
    <span id="pill-hunter" class="pill"></span>
    <span id="pill-gmail" class="pill"></span>
    <a class="btn small" href="https://mail.google.com/mail/u/0/#drafts" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Open Gmail Drafts</a>
    <button class="btn small" id="btn-score">Scorecard</button>
  </header>
  <main class="desk">
    <aside class="left">
      <button class="item" id="btn-news" style="border-left-color:transparent"><div class="top"><span>Google News results</span><span id="news-count"></span></div><div class="dom">Why companies were found</div></button>
      <div class="list" id="list" role="list"></div>
    </aside>
    <section class="right" id="detail"></section>
  </main>
  <dialog id="score-dialog"></dialog>
  <script src="/static/app.js"></script>
</body>
</html>
